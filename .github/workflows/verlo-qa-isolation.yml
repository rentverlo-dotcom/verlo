name: VERLO QA - isolation smoke

on:
  push:
    branches:
      - qa/verlo-e2e
    paths:
      - '.github/workflows/verlo-qa-isolation.yml'
      - 'tests/qa/**'
      - 'playwright.qa.config.ts'
      - 'middleware.ts'
      - 'app/api/qa/tradicionales/preflight/route.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verlo-qa-isolation
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all QA isolation and traditional preflight tests
        run: npx playwright test --config=playwright.qa.config.ts
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-isolation-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
