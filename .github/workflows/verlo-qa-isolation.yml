name: VERLO QA - isolation and traditional matching

on:
  push:
    branches:
      - qa/verlo-e2e
    paths:
      - '.github/workflows/verlo-qa-isolation.yml'
      - 'tests/qa/**'
      - 'playwright.qa.config.ts'
      - 'middleware.ts'
      - 'app/api/qa/**'
      - 'app/api/lead-intake/route.ts'
      - 'lib/qa/**'
      - 'lib/meta/capi.ts'
      - 'lib/notifications/**'
      - 'lib/push.ts'
      - 'lib/email.ts'
      - 'lib/contracts/traditional-purpose.ts'
      - 'app/api/closing-generate/route.ts'
      - 'lib/temporarios/contract-pdf.ts'
      - 'lib/powermarket/contract-pdf.ts'
      - 'tests/powermarket-pdf.spec.ts'
      - 'tests/mercadopago-contract-webhook.spec.ts'
      - 'tests/caucion-contract-discount.spec.ts'
      - 'lib/payments/caucion-contract-discount.ts'
      - 'lib/payments/mercadopago-contract-state.ts'
      - 'app/api/webhooks/mercadopago/route.ts'
      - 'app/layout.tsx'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verlo-qa-isolation
  cancel-in-progress: true

jobs:
  qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      QA_BASE_URL: https://verlopunto0-git-qa-verlo-e2e-verlos-projects-b9e9c595.vercel.app
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for exact QA commit deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 15 "$QA_BASE_URL/api/qa/status" | node -e "
              let buf = '';
              process.stdin.on('data', x => buf += x);
              process.stdin.on('end', () => {
                try {
                  const status = JSON.parse(buf);
                  if (!(status.ok && status.branch && status.database &&
                    status.commit === process.env.GITHUB_SHA)) process.exit(1);
                } catch { process.exit(1); }
              });
            "; then
              echo "Verified QA branch, QA database, exact deployed SHA"
              exit 0
            fi
            sleep 12
          done
          echo "QA deployment not ready for this exact commit"
          exit 1
      - name: Exercise synthetic match interest and contract double OK
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS --max-time 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=verlo-qa-mi-verlo" | jq -er '.value')"
          curl -fsS --max-time 120 -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{}' "$QA_BASE_URL/api/qa/contracts/lifecycle" | node -e "
            let input = '';
            process.stdin.on('data', data => input += data);
            process.stdin.on('end', () => {
              let out;
              try { out = JSON.parse(input); } catch { process.exit(1); }
              if (!(out.ok && out.qaOnly && out.realApiHandlers &&
                  out.noExternalDelivery && out.identityVerificationSimulated &&
                  out.twoInterests && out.firstDoubleOk && out.draftPersisted &&
                  out.contractTokenRoles === 2 && out.secondDoubleOk &&
                  out.repeatIdempotent && out.bothLegalPartiesSaved &&
                  out.ownDataProtected && out.legalUpdateIdempotent &&
                  out.prematureAgreementDenied && out.invalidRentalPriceDenied &&
                  out.completeContractContentGenerated && out.unpaidAgreementDenied &&
                  out.qaPaymentSimulated && out.bothPartyAgreementsRecorded &&
                  out.agreedLegalDataImmutable && out.agreementReplayIdempotent &&
                  out.contractPdfPreflight && out.signingPreflightOnPersistedContract && typeof out.contractExamplePdfBase64 === 'string')) {
                console.error('Synthetic contracts lifecycle failed:', out.error || 'assertions');
                process.exit(1);
              }
              const fs = require('node:fs');
              const pdf = Buffer.from(out.contractExamplePdfBase64, 'base64');
              if (!pdf.subarray(0, 8).toString('ascii').startsWith('%PDF-1.4')) process.exit(1);
              fs.mkdirSync('qa-evidence', { recursive: true });
              fs.writeFileSync('qa-evidence/VERLO-contrato-QA-ejemplo.pdf', pdf);
              console.log('QA example contract PDF saved as Playwright evidence');
              console.log('Real contract handlers QA: first and second double OK, draft and idempotency verified');
            });
          "
      - name: Exercise real QA caucion submissions and concurrent idempotency
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS --max-time 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=verlo-qa-mi-verlo" | jq -er '.value')"
          curl -fsS --max-time 120 -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{}' "$QA_BASE_URL/api/qa/powermarket/submission" | node -e "
            let input = '';
            process.stdin.on('data', part => input += part);
            process.stdin.on('end', () => {
              let data;
              try { data = JSON.parse(input); } catch { process.exit(1); }
              const flags = ['ok','qaOnly','actualHandlers','consentDenied','invalidTokenDenied',
                'concurrentSameApplication','replayIdempotent','exactlyOneStoredApplication',
                'matchingEconomicFields','exactlyOneAuditEvent','noExternalPartner'];
              if (!flags.every(flag => data[flag] === true)) {
                console.error('PowerMarket QA application submission failed:', data.error || data);
                process.exit(1);
              }
              console.log('PowerMarket QA: real submission, concurrency and durable data verified');
            });
          "

      - name: Exercise two real QA Auth users through Temporarios APIs, reservation and contract
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl -fsS --max-time 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=verlo-qa-mi-verlo" | jq -er '.value')"
          curl -fsS --max-time 120 -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{}' "$QA_BASE_URL/api/qa/temporarios/lifecycle" | node -e "
            let input = '';
            process.stdin.on('data', chunk => input += chunk);
            process.stdin.on('end', () => {
              let result;
              try { result = JSON.parse(input); } catch { process.exit(1); }
              const required = ['ok','qaOnly','realTemporaryApiHandlers',
                'twoAuthenticatedRoles','matchIdempotent','ownerTenantIsolation',
                'doubleAcceptance','reservationTermsAccepted','unpaidConfirmationDenied',
                'feeSimulated','verifiedFeeRpcSimulated','bilateralReservationConfirmed','notificationRecipientsVerified','notificationDeduplicated','contractAgreedByBoth',
                'temporaryContractPdf','noRealPayment','noExternalNotifications'];
              if (!required.every(key => result[key] === true)) {
                console.error('Temporary QA lifecycle failed:', result.error || 'invalid assertion');
                process.exit(1);
              }
              console.log('Temporary QA lifecycle PASS: real API handlers, two accounts, booking, agreed contract and PDF');
            });
          "
      - name: Verify existing contractual PDF generator without external services
        run: npx playwright test tests/powermarket-pdf.spec.ts --reporter=line
      - name: Verify real QA Auth with two synthetic customer roles
        shell: bash
        run: |
          set -euo pipefail
          # GitHub supplies a short-lived, workflow-bound OIDC token. The server
          # verifies signature, repository, workflow, ref and deployed SHA.
          token="$(curl -fsS --max-time 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=verlo-qa-mi-verlo" | jq -er '.value')"
          curl -fsS --max-time 120 -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '{}' "$QA_BASE_URL/api/qa/mi-verlo/isolation" | node -e "
            let input = '';
            process.stdin.on('data', chunk => input += chunk);
            process.stdin.on('end', () => {
              let result;
              try { result = JSON.parse(input); } catch { process.exit(1); }
              if (!(result.ok && result.qaOnly && result.realSupabaseAuth &&
                    result.twoTemporaryUsers && result.ownerOnlyOwnData &&
                    result.tenantOnlyOwnData && result.sharedMatchVisible)) {
                console.error('Mi VERLO QA identity isolation failed:', result.error || 'assertions');
                process.exit(1);
              }
              console.log('Mi VERLO real Auth: separate owner / tenant + shared match verified');
            });
          "
      - name: Verify Mercado Pago contract webhook states without sending payments
        run: npx playwright test tests/mercadopago-contract-webhook.spec.ts --reporter=line
      - name: Verify contract fee and PowerMarket 50 percent discount without network or charges
        run: npx playwright test tests/caucion-contract-discount.spec.ts --reporter=line
      - name: Run isolated QA Playwright suite
        run: npx playwright test --config=playwright.qa.config.ts
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-e2e-playwright-evidence
          path: |
            qa-evidence/*.pdf
            playwright-report/
            test-results/
          if-no-files-found: ignore
