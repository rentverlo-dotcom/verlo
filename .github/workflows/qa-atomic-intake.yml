name: QA Atomic Intake E2E
on:
  push:
    branches:
      - fix/seo-georef-qa-20261025
    paths:
      - .github/workflows/qa-atomic-intake.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify real atomic intake with isolated QA email
        env:
          PLAYWRIGHT_BASE_URL: https://verlopunto0-8ds99hvq2-verlos-projects-b9e9c595.vercel.app
        run: npx playwright test tests/atomic-intake-qa.spec.ts --workers=1 --reporter=line
