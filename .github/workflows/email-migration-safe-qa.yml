name: VERLO email migration safe QA

on:
  push:
    branches: [main]
    paths:
      - 'lib/notifications/zeptomail.ts'
      - 'lib/notifications/verlo-email-templates.ts'
      - 'tests/email-migration.spec.ts'
      - 'app/api/admin/email-dispatch/route.ts'
      - 'app/api/admin/powermarket-email-capture/route.ts'
      - 'lib/notifications/verlo-email-outbox.ts'
      - 'lib/lead-notifications.ts'
      - 'app/api/temporarios/notifications/dispatch/route.ts'
      - 'app/api/cron/powermarket-push/route.ts'
      - 'supabase/migrations/20261103_verlo_email_outbox_preparation.sql'
      - 'supabase/migrations/20261103_verlo_email_event_destinations.sql'
      - '.github/workflows/email-migration-safe-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-no-send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERLO_ZEPTO_EMAIL_LIVE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Test mocked Zoho transport and 3 workflow templates
        run: npx playwright test tests/email-migration.spec.ts --reporter=line
