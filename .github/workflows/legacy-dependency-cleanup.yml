name: VERLO - isolated legacy dependency cleanup

on:
  push:
    branches:
      - security/legacy-dependency-cleanup
    paths:
      - '.github/workflows/legacy-dependency-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Assert no remaining swipe dependency or live import
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); for(const n of ['react-tinder-card','@react-spring/web']) if(p.dependencies?.[n]) throw Error('legacy package remains: '+n)"
          if git grep -n -E 'react-tinder-card|@react-spring/web' -- app components lib owner; then
            echo "Legacy import still present"; exit 1
          fi
      - name: Verify npm lockfile with clean install
        run: npm ci
      - name: Verify pnpm frozen lockfile independently
        run: npx --yes pnpm@9.15.9 install --frozen-lockfile --ignore-scripts
      - name: Recheck isolated security tests
        run: npx playwright test tests/qa/legacy-property-api-closure.spec.ts --config=playwright.qa.config.ts
