name: VERLO - isolated legacy dependency cleanup

on:
  push:
    branches:
      - security/legacy-dependency-cleanup
    paths:
      - '.github/workflows/legacy-dependency-cleanup.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Assert no remaining swipe dependency or live import
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); for(const n of ['react-tinder-card','@react-spring/web']) if(p.dependencies?.[n]) throw Error('legacy package remains: '+n)"
          if git grep -n -E 'react-tinder-card|@react-spring/web' -- app components lib owner; then
            echo "Legacy import still present"; exit 1
          fi
      - name: Verify npm lockfile with clean install
        run: npm ci
      - name: Normalize previously stale pnpm lockfile and verify frozen installation
        run: |
          npx --yes pnpm@9.15.9 install --lockfile-only --no-frozen-lockfile --ignore-scripts
          npx --yes pnpm@9.15.9 install --frozen-lockfile --ignore-scripts
      - name: Persist verified pnpm lockfile only on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(deps): sync verified pnpm lockfile with package.json'
            git push origin HEAD:security/legacy-dependency-cleanup
          fi
      - name: Recheck isolated security tests
        run: npx playwright test tests/qa/legacy-property-api-closure.spec.ts --config=playwright.qa.config.ts
