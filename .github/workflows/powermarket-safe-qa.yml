name: PowerMarket safe visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - "tests/powermarket-safe-e2e.spec.ts"
      - ".github/workflows/powermarket-safe-qa.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test-results
      - name: Run read-only PowerMarket tests
        run: npx playwright test tests/powermarket-safe-e2e.spec.ts --reporter=list
        env:
          POWERMARKET_QA_ORIGIN: https://verlo.lat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powermarket-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 7
