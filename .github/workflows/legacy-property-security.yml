name: VERLO - legacy property endpoint security

on:
  push:
    branches:
      - security/legacy-property-api-closure
    paths:
      - '.github/workflows/legacy-property-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-legacy-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci
      - name: TypeScript compile (no output)
        run: npx tsc --noEmit
      - name: Verify legacy endpoints and authorized saved properties
        run: npx playwright test tests/qa/legacy-property-api-closure.spec.ts --config=playwright.qa.config.ts
