name: VERLO - isolated Next 15 compatibility probe

on:
  push:
    branches:
      - security/next15-release-validation
    paths:
      - '.github/workflows/next15-compatibility-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-and-build-probe:
    name: Next 15 + React 19 / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify baseline lockfile (no writes to repository)
        run: npm ci --ignore-scripts
      - name: Temporarily install supported framework major without changing tracked files
        run: npm install --no-save --package-lock=false next@15 react@19 react-dom@19
      - name: Print resolved framework versions
        run: node -e "for (const p of ['next','react','react-dom']) console.log(p,require(p+'/package.json').version)"
      - name: Check TypeScript compatibility
        run: npx tsc --noEmit
      - name: Check Next production build
        run: npx next build
