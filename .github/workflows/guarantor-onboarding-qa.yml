name: VERLO Signatura guarantor offline QA
on:
  push:
    branches: [feature/signatura-qa-integration]
    paths:
      - 'lib/guarantors/**'
      - 'lib/signatura/contract-access.ts'
      - 'app/api/signatura/contract-signing/**'
      - 'app/api/signatura/contract-reconcile/**'
      - 'app/api/signatura/contract-signed/**'
      - 'components/signatura/MySignaturaContractSigning.tsx'
      - 'supabase/migrations/20261126_signatura_contract_signings.sql'
      - 'app/api/guarantors/**'
      - 'app/api/closing-guarantor-invite/**'
      - 'app/cierre/[token]/page.tsx'
      - 'app/garante/activar/**'
      - 'components/guarantors/**'
      - 'supabase/migrations/20261126_guarantor_private_dossier_review.sql'
      - 'supabase/migrations/20261126_guarantor_tenant_closing_invite.sql'
      - 'components/guarantors/**'
      - 'app/mi-verlo/page.tsx'
      - 'app/api/closing-generate/route.ts'
      - 'app/api/closing-agree/route.ts'
      - 'lib/identik/traditional-signing-preflight.ts'
      - 'lib/notifications/verlo-email-templates.ts'
      - 'lib/notifications/verlo-email-outbox.ts'
      - 'supabase/migrations/20261126_contract_guarantor_participants.sql'
      - 'tests/qa/guarantor-onboarding.spec.ts'
      - '.github/workflows/guarantor-onboarding-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-send-guarantor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit
      - name: Test guarantor authorization, blocked signing and no provider deliveries
        run: npx playwright test tests/qa/guarantor-onboarding.spec.ts --config=playwright.qa.config.ts
