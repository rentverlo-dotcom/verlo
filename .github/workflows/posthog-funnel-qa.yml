name: VERLO PostHog funnel QA

on:
  push:
    branches: [main]
    paths:
      - 'components/VerloAnalyticsObserver.tsx'
      - 'lib/posthog-client.ts'
      - 'app/layout.tsx'
      - 'app/buscar/page.tsx'
      - 'app/propietario/publicar-v2/page.tsx'
      - 'app/caucion/solicitar/page.tsx'
      - 'app/powermarket/page.tsx'
      - 'components/powermarket/MyCaucionStatus.tsx'
      - 'tests/posthog-funnel.spec.ts'
      - '.github/workflows/posthog-funnel-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright test tests/posthog-funnel.spec.ts --reporter=line
