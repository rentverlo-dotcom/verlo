name: VERLO - Next 15 patched migration diagnostic

on:
  push:
    branches:
      - security/next15-patched-upgrade
    paths:
      - '.github/workflows/next15-upgrade-diagnostic.yml'
      - 'app/alquileres/**'
      - 'app/temporarios/**'
      - 'app/api/enums/**'
      - 'app/api/matches/**'
      - 'app/api/temporarios/media/**'
      - 'app/mockup-lab/**'
      - 'app/api/qa/powermarket/**'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-public-test-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-private-build-only-key
      R2_ACCOUNT_ID: dummy-build-account
      R2_ACCESS_KEY_ID: dummy-build-access-key
      R2_SECRET_ACCESS_KEY: dummy-build-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The historic npm lock is not reproducible with Node 24's npm; the
      # clean Node 20 baseline was already certified separately.
      - name: Install supported patched Next 15 / React 19 temporarily
        run: npm install --no-save --package-lock=false next@15.5.29 react@19.3.1 react-dom@19.3.1 @types/react@19 @types/react-dom@19
      - name: Confirm resolved versions
        run: node -e "for(const p of ['next','react','react-dom','@types/react','@types/react-dom']) console.log(p,require(p+'/package.json').version)"
      - name: Generate ephemeral public/private VAPID pair for offline build imports
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const keys = require('web-push').generateVAPIDKeys()
          fs.appendFileSync(process.env.GITHUB_ENV,
            'NEXT_PUBLIC_VAPID_PUBLIC_KEY=' + keys.publicKey + '\\n' +
            'VAPID_PRIVATE_KEY=' + keys.privateKey + '\\n' +
            'VAPID_SUBJECT=mailto:qa-build@example.com\\n')
          NODE
      - name: Compile candidate; report all TypeScript errors on failure
        shell: bash
        run: |
          if ! npx next build; then
            echo 'NEXT15_BUILD_FAILED: printing complete TypeScript diagnostics; not a certified upgrade'
            npx tsc --noEmit --pretty false || true
            exit 1
          fi
      - name: Run scoped legacy-security checks
        run: npx playwright test tests/qa/legacy-property-api-closure.spec.ts --config=playwright.qa.config.ts
