name: E2E Preview

on:
  push:
    branches:
      - fix/e2e-post-visit-double-ok
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PLAYWRIGHT_BASE_URL: https://verlopunto0-git-fix-e2e-post-vi-2c8fd5-verlos-projects-b9e9c595.vercel.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke
        run: npm run test:smoke

      - name: Full E2E
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
